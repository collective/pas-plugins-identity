name: Backend CI

on:
  workflow_call:
    inputs:
      base-tag:
        required: true
        type: string
      image-name-prefix:
        required: true
        type: string
      image-name-suffix:
        required: true
        type: string
      python-version:
        required: true
        type: string
      plone-version:
        required: true
        type: string
      working-directory:
        required: false
        type: string
        default: backend

jobs:

  lint:
    name: "Backend: Lint"
    uses: plone/meta/.github/workflows/backend-lint.yml@2.x
    with:
      python-version: ${{ inputs.python-version }}
      plone-version: ${{ inputs.plone-version }}
      working-directory: ${{ inputs.working-directory }}

  # The floor is Plone 6.2 / Python 3.12 (see pyproject's requires-python and
  # classifiers); anything older is out of scope by decision, not by accident.
  # The ceiling is 3.14, which is also what the reusable workflows default to.
  test:
    name: "Backend: Test"
    uses: plone/meta/.github/workflows/backend-pytest.yml@2.x
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        plone-version: ['6.2-latest']
    with:
      python-version: ${{ matrix.python-version }}
      plone-version: ${{ matrix.plone-version }}
      working-directory: ${{ inputs.working-directory }}

  # The four dependency configurations the package promises to support.
  # ``pip install pas.plugins.identity`` with no extras has to work on its
  # own, so "core" is the job that matters most here -- it is the one that
  # fails the moment something in core starts needing an optional dependency.
  extras:
    name: "Backend: Extras (${{ matrix.name }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            extras: ''
          - name: +profile
            extras: 'profile'
          - name: +server
            extras: 'server'
          - name: all
            extras: 'profile,server'
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup codebase
        uses: plone/meta/.github/actions/setup_backend_uv@2.x
        with:
          python-version: ${{ inputs.python-version }}
          plone-version: ${{ inputs.plone-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Install extras
        run: make install-extras EXTRAS=${{ matrix.extras }}

      - name: Test
        run: make test
        env:
          # Fail rather than skip if Docker is missing: the flow tests are the
          # only thing proving the protocol integration works.
          PAS_IDENTITY_REQUIRE_DOCKER: "1"

  # "pip install . in a clean venv imports". The extras matrix cannot
  # cover this -- every one of its jobs installs [test] -- so a runtime
  # dependency that only the test extra happens to provide would slip through.
  clean_install:
    name: "Backend: No-extras install imports"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup codebase
        uses: plone/meta/.github/actions/setup_backend_uv@2.x
        with:
          python-version: ${{ inputs.python-version }}
          plone-version: ${{ inputs.plone-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Import from a no-extras install
        run: make check-clean-install

  # The hard layer boundary, enforced rather than documented.
  imports:
    name: "Backend: Layer boundaries"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup codebase
        uses: plone/meta/.github/actions/setup_backend_uv@2.x
        with:
          python-version: ${{ inputs.python-version }}
          plone-version: ${{ inputs.plone-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Check layer boundaries
        run: make check-imports

      - name: Check the coverage pragma policy
        run: make check-pragmas

  coverage:
    name: "Backend: Coverage"
    uses: plone/meta/.github/workflows/backend-pytest-coverage.yml@2.x
    with:
      python-version: ${{ inputs.python-version }}
      plone-version: ${{ inputs.plone-version }}
      working-directory: ${{ inputs.working-directory }}

  release:
    name: "Backend: Build and publish Container Image"
    uses: plone/meta/.github/workflows/container-image-build-push.yml@2.x
    needs:
      - lint
      - test
      - extras
      - clean_install
      - imports
      - coverage
    permissions:
      contents: read
      packages: write
    with:
      base-tag: ${{ inputs.base-tag }}
      image-name-prefix: ${{ inputs.image-name-prefix }}
      image-name-suffix: ${{ inputs.image-name-suffix }}
      working-directory: ${{ inputs.working-directory }}
      build-args: |
        PLONE_VERSION=${{ inputs.plone-version }}
      push: ${{ github.event_name != 'pull_request' }}
    secrets:
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  report:
    name: "Final report"
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - extras
      - clean_install
      - imports
      - coverage
      - release
    steps:
      - name: Write report
        run: |
          echo '# Workflow Report' >> $GITHUB_STEP_SUMMARY
          echo '| Job ID | Conclusion |' >> $GITHUB_STEP_SUMMARY
          echo '| --- | --- |' >> $GITHUB_STEP_SUMMARY
          echo '| lint | ${{ needs.lint.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| test | ${{ needs.test.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| extras | ${{ needs.extras.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| clean-install | ${{ needs.clean_install.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| imports | ${{ needs.imports.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| coverage | ${{ needs.coverage.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| release | ${{ needs.release.result }} |' >> $GITHUB_STEP_SUMMARY
