name: Acceptance

# The Volto add-on in a real browser, against a production build.
#
# The backend runs from its acceptance image. The frontend is built and served
# from this runner's own install rather than from the frontend image: the tests
# need the install's two copies of react-aria-components (#153), and
# `acceptance/global-setup.ts` can only check an install it can see.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: true

jobs:
  acceptance:
    name: "Acceptance: Playwright"
    runs-on: ubuntu-latest
    steps:
      - name: Main checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup uv
        uses: plone/meta/.github/actions/setup_uv@2.x
        with:
          working-directory: frontend

      - name: Setup codebase
        uses: plone/meta/.github/actions/setup_frontend@2.x
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: frontend

      # Dex is the OpenID Connect provider the federated sign-in tests go
      # through. The backend shares the runner's network with it, so both the
      # browser and the backend reach Dex at the issuer its discovery
      # document names, http://127.0.0.1:5556/dex.
      - name: Start Dex
        shell: bash
        run: |
          make acceptance-dex-start

      - name: Start the backend
        shell: bash
        run: |
          make acceptance-backend-image-build
          make acceptance-backend-container-start ACCEPTANCE_BACKEND_NETWORK="--network host"

      - name: Build and start the frontend
        shell: bash
        working-directory: frontend
        run: |
          nohup make acceptance-frontend-prod-start > frontend.log 2>&1 &

      - name: Install the browser
        shell: bash
        working-directory: frontend
        run: |
          pnpm exec playwright install --with-deps chromium

      - name: Wait for both servers
        shell: bash
        working-directory: frontend
        run: |
          # The frontend is probed as `localhost`, the host the tests browse.
          # Volto's proxy fixes the address it hands the backend on the first
          # request it serves, so a first request to 127.0.0.1 would make
          # every URL the backend writes name a host the browser is not on.
          pnpm dlx wait-on --timeout 600000 --httpTimeout 20000 \
            http-get://127.0.0.1:55001/plone http://localhost:3000 \
            http-get://127.0.0.1:5556/dex/.well-known/openid-configuration

      - name: Run the acceptance tests
        shell: bash
        working-directory: frontend
        run: |
          make ci-acceptance-test

      - name: Backend and Dex logs
        if: ${{ failure() }}
        shell: bash
        run: |
          docker logs pas-plugins-identity-backend-acceptance 2>&1 | tail -n 100 || true
          docker logs pas-plugins-identity-dex-acceptance 2>&1 | tail -n 100 || true

      - name: Keep the traces and the frontend log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-results
          path: |
            frontend/acceptance/results
            frontend/frontend.log
          if-no-files-found: ignore
