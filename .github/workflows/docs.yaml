name: Docs

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.14"

jobs:
  build:
    name: "Docs: Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: docs/uv.lock

      - name: Setup Python
        run: uv python install ${{ inputs.python-version }}
        working-directory: docs

      - name: Install
        run: uv sync
        working-directory: docs

      # -W turns a warning into an error, so a dead cross reference, an
      # orphaned page or a malformed directive fails here rather than
      # shipping. The event contract page has to be part of this build.
      - name: Build
        run: make docs-build

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/_build/html
          retention-days: 7
