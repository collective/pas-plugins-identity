[project]
name = "pas.plugins.identity"
dynamic = ["version"]
description = "Multi-provider external authentication for Plone, with identity linking"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.12"
authors = [
    { name = "Érico Andrei", email = "ericof@plone.org" },
]
keywords = [
    "CMS",
    "Plone",
    "Python",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Plone",
    "Framework :: Plone :: 6.2",
    "Framework :: Plone :: Addon",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "Authlib>=1.3",
    "Products.CMFPlone",
    "plone.api",
    "plone.restapi",
    # core/flows imports authlib.integrations.requests_client at module scope,
    # and Authlib does not pull requests in on its own. Today it arrives anyway
    # via Products.CMFPlone (plone.app.event, plone.app.portlets and
    # plone.cachepurging each require it unconditionally), so this is declared
    # for honesty rather than to fix a live breakage: what we import directly
    # should not depend on another package's dependency graph staying put.
    "requests",
]

[project.optional-dependencies]
profile = [
    "plone.app.dexterity",
]
server = [
    "cryptography>=42",
]
test = [
    "collective.MockMailHost",
    # Migration fixtures. Test-only, and deliberately real rather than
    # synthesized: a fixture that encodes our reading of their storage would
    # pass while the migration was wrong about it.
    "pas.plugins.authomatic>=2.0.0",
    "pas.plugins.oidc>=2.0.0",
    "horse-with-no-namespace",
    "import-linter",
    "plone.app.testing",
    "plone.restapi[test]",
    "pytest",
    "pytest-cov",
    "pytest-docker",
    "pytest-plone>=1.0.0",
    "requests",
]

[project.urls]
Homepage = "https://github.com/collective/pas-plugins-identity"
PyPI = "https://pypi.org/project/pas.plugins.identity"
Source = "https://github.com/collective/pas-plugins-identity"
Tracker = "https://github.com/collective/pas-plugins-identity/issues"


[project.entry-points."plone.autoinclude.plugin"]
target = "plone"

[tool.uv]
managed = false

[tool.hatch.version]
path = "src/pas/plugins/identity/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
strict-naming = true

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pas"]

[tool.towncrier]
directory = "news/"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} ({project_date})"
template = "news/.changelog_template.jinja"
issue_format = "[#{issue}](https://github.com/collective/pas-plugins-identity/issues/{issue})"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Feature"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfix"
showcontent = true

[[tool.towncrier.type]]
directory = "internal"
name = "Internal"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "tests"
name = "Tests"
showcontent = true

[tool.ruff]
target-version = "py312"
line-length = 88
fix = true
lint.select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
]
lint.ignore = [
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.isort]
case-sensitive = false
no-sections = true
force-single-line = true
from-first = true
lines-after-imports = 2
lines-between-types = 1
order-by-type = false

[tool.ruff.format]
preview = true

[tool.ruff.lint.per-file-ignores]
# S105/S106: test fixtures carry obviously-fake provider secrets.
"tests/*" = ["E501", "RUF001", "S101", "S105", "S106"]
# ``id`` and ``title`` are the constructor signature Zope factories expect.
"src/pas/plugins/identity/core/pas/plugin.py" = ["A002"]
# A002: ``object`` is CMFCore's parameter name for the indexing methods we
# override. Renaming it would break every keyword caller in Zope.
"src/pas/plugins/identity/profile/catalog.py" = ["A002"]
# A002: ``id``, ``login`` and friends are the IUserEnumerationPlugin
# signature, and ``id``/``title`` the Zope factory signature.
"src/pas/plugins/identity/profile/pas.py" = ["A002"]
# A002: ``id``/``title`` are the Zope factory signature here too.
"src/pas/plugins/identity/server/pas.py" = ["A002"]
# S311: the churn sequences are randomized for coverage of orderings, not
# for unpredictability; the seeds are fixed precisely so they repeat.
"tests/profile/test_churn.py" = ["S311"]

[tool.check-manifest]
ignore = [
    ".editorconfig",
    ".flake8",
    "dependabot.yml",
    "mx.ini",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: needs the compose stack in tests/docker-compose.yml.",
]

[tool.coverage.run]
source_pkgs = ["pas.plugins.identity", "tests"]
branch = true
parallel = true
omit = [
  "src/pas/plugins/identity/locales/*.py",
]

# The floor is 100% *branch* coverage, and it is enforced rather than
# reported. An authentication plugin has no line that is fine to leave
# unexercised, and the cheapest moment to cover one is when it is written.
[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

# The hard layer boundary. ``core`` is what ``pip install
# pas.plugins.identity`` gives you with no extras, so it must never reach
# into a layer that may not be installed -- and the two optional layers must
# not grow a dependency on each other either.
[tool.importlinter]
root_packages = ["pas.plugins.identity"]

[[tool.importlinter.contracts]]
name = "Core never imports the optional layers"
type = "forbidden"
source_modules = ["pas.plugins.identity.core"]
forbidden_modules = [
  "pas.plugins.identity.profile",
  "pas.plugins.identity.server",
]

[[tool.importlinter.contracts]]
name = "The optional layers are independent of each other"
type = "independence"
modules = [
  "pas.plugins.identity.profile",
  "pas.plugins.identity.server",
]