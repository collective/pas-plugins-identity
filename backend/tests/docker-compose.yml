# The OIDC provider the functional flow tests run against.
#
# Started and stopped by pytest-docker, on demand: only tests that ask for the
# ``dex_service`` fixture bring it up, so the unit and integration suite stays
# free of Docker. `make dex-start` / `make dex-stop` drive the same stack by
# hand while developing.
services:
  dex:
    image: ghcr.io/dexidp/dex:${DEX_VERSION:-v2.44.0}
    command: ['dex', 'serve', '/etc/dex/config.yaml']
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      # Fixed rather than ephemeral: Dex publishes its issuer in the discovery
      # document and refuses to be reached under any other URL, so the port
      # has to match the issuer in dex/config.yaml.
      - 5556:5556

  # Keycloak, for the back-channel logout tests and nothing else. Dex is the
  # provider for every other flow test -- lighter, config-as-a-file, and
  # deterministic -- but it does not implement back-channel logout, so the
  # one place this package needs evidence that a *real* provider's logout
  # token is accepted needs a provider that sends one.
  #
  # No Postgres and no custom image, unlike the setup pas.plugins.oidc uses:
  # `start-dev --import-realm` runs against the built-in dev database, which
  # is exactly right for a container that is thrown away after the test.
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.0}
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: 'true'
      KC_HTTP_ENABLED: 'true'
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    # So the container can reach a listener on the host: the test stands one
    # up to catch the logout token Keycloak posts, on an ephemeral port.
    # Docker Desktop resolves host.docker.internal already; this is what
    # makes it resolve on Linux too.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      # Fixed for the same reason Dex's is: Keycloak publishes its issuer in
      # the discovery document and will not be reached under another URL.
      - 8180:8080
