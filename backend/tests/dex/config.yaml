# Dex configuration for the functional flow tests (C2).
#
# Deliberately minimal: in-memory storage, one static client, one static
# password. There is no database, so the container is up in about a second
# and every run starts from the same state.
#
# The issuer must be exactly the URL the tests reach Dex at -- Dex publishes
# it in the discovery document, and metadata resolution refuses a document
# that declares a different issuer (RFC 8414 section 3.3).
issuer: http://127.0.0.1:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

# Dex matches redirect URIs exactly; no wildcards. This is the value the
# tests put in the pas.plugins.identity.callback_url registry record, and it
# stands in for the Volto route.
# Two clients, because Gate 2 needs a *second* provider to link to. Dex
# serves both from one issuer, which is enough: the identity key is
# (provider_id, subject), and the two providers carry different provider ids.
staticClients:
  - id: plone
    name: Plone
    secret: plone-secret
    redirectURIs:
      - http://localhost:3000/login-identity
  - id: plone-second
    name: Plone (second provider)
    secret: plone-second-secret
    redirectURIs:
      - http://localhost:3000/login-identity

oauth2:
  # Skip the "grant access to Plone?" interstitial: the tests drive the login
  # form headlessly, and the consent screen is not what they are testing.
  skipApprovalScreen: true

enablePasswordDB: true

# Password is "plone-test-password"; the hash was generated with bcrypt at
# cost 10 and verified, not copied from a tutorial.
staticPasswords:
