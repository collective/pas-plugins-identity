[project]
name = "identitydemo"
version = "1.0.0a0"
description = "The federation demo stack for pas.plugins.identity. Never published."
requires-python = ">=3.12"
license = "GPL-2.0-only"
authors = [
    { name = "Érico Andrei", email = "ericof@plone.org" },
]
# Deliberately not on PyPI, and the classifier says so rather than relying on
# nobody running `hatch publish` here by accident.
classifiers = [
    "Private :: Do Not Upload",
    "Framework :: Plone",
    "Framework :: Plone :: Addon",
]
dependencies = [
    # ``content`` was merged into core; the extra is gone. ``sql`` is
    # here because the demo records its authentication events to the
    # PostgreSQL service in docker-compose.demo.yml.
    "pas.plugins.identity[server,sql]",
    # Replaces the site's MailHost with one that prints the message to the
    # log instead of delivering it. The demo has magic-link login switched
    # on and no mail server anywhere near it; without this, asking for a
    # link is an SMTP connection that fails, and with it the link is in
    # `make demo-stack-logs`.
    "Products.PrintingMailHost",
]

[project.entry-points."plone.autoinclude.plugin"]
target = "plone"

[tool.uv]
managed = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identitydemo"]
