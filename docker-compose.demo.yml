---
# The manual federation stack: two full Plone sites, in a browser.
#
#   id.localhost      site A -- core + profile + server. An OpenID provider.
#   plone.localhost   site B -- core, with the generic OIDC driver pointed at A.
#
# Deliberately separate from tests/federation/docker-compose.yml, which is the
# hermetic federation stack: that one has to run in CI, so it is headless, gets no
# real provider and publishes ports directly. This one exists for exactly what
# CI cannot do -- a real browser, real cross-origin cookies between sibling
# .localhost hosts, Volto's real login route and its real callback route.
#
# Separate from docker-compose.yml too, which is the ordinary one-site
# development stack. Growing that into this would build two Volto frontends
# for everyone running `make stack-start`.
#
#   make demo-stack-start     then open http://plone.localhost
#
# Both hosts are `<name>.$DEMO_STACK_DOMAIN`, defaulting to `localhost`.
# Google refuses to register a redirect URI on a `.localhost` host, so a
# provider that insists on a real domain needs another one: set
# DEMO_STACK_DOMAIN to a domain you control, point `id.` and `plone.` at
# 127.0.0.1 in /etc/hosts, and the whole stack follows -- Traefik's rules,
# the virtual-host rewrites, the issuer and the redirect URI alike.
#
# Sign in with dana / dana-demo-password. They exist only on id.localhost,
# as a UserProfile: this stack keeps its users, and their passwords,
# as content rather than in source_users.

name: pas-plugins-identity-demo

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile.demo
  args:
    - PLONE_VERSION=${PLONE_VERSION:-6.2.1}

# One frontend image for both sites. They differ only in their environment
# now: the password-form switch is read at run time through Volto's
# `runtimeConfig`, so it is no longer baked into the bundle and no longer a
# reason to build twice.
x-frontend-image: &frontend-image pas-plugins-identity-demo-frontend

x-frontend-build: &frontend-build
  context: ./frontend
  args:
    - VOLTO_VERSION=${VOLTO_VERSION}

# Both sites read these. The URLs are what identitydemo.settings reads at
# import time, and they have to be what the browser actually types: the issuer
# is compared as a string, never parsed, and the redirect URI is compared byte
# for byte at the token endpoint.
#
# No ports and no /Plone here, unlike the hermetic stack: Traefik serves each
# site at the root of its own hostname.
x-demo-env: &demo-env
  IDENTITY_DEMO: '1'
  DEMO_IDP_URL: http://id.${DEMO_STACK_DOMAIN:-localhost}
  DEMO_RP_URL: http://plone.${DEMO_STACK_DOMAIN:-localhost}
  DEMO_REDIRECT_URI: http://plone.${DEMO_STACK_DOMAIN:-localhost}/login-identity
  SITE: Plone
  CONFIGURE_PACKAGES: plone.restapi,plone.volto,identitydemo

services:
  traefik:
    image: traefik:v3.7
    ports:
      - 80:80
    # Both public hostnames resolve to Traefik from inside the network too.
    # The relying party fetches discovery server to server, but under the
    # issuer's public hostname, because that is the only name the issuer
    # answers to -- one URL that has to resolve in the browser and in a
    # container, which is the single most confusing thing about this stack.
    networks:
      default:
        aliases:
          - id.${DEMO_STACK_DOMAIN:-localhost}
          - plone.${DEMO_STACK_DOMAIN:-localhost}
    labels:
      - traefik.enable=true
      - traefik.constraint-label=public
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.gzip.compress.excludedcontenttypes=image/png, image/jpeg, font/woff2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - --providers.docker
      - --providers.docker.constraints=Label(`traefik.constraint-label`, `public`)
      - --providers.docker.exposedbydefault=false
      - --entrypoints.http.address=:80
      - --accesslog
      - --log
      - --api

  # ------------------------------------------------------------------
  # id.localhost -- the identity provider
  # ------------------------------------------------------------------
  idp-frontend:
    build: *frontend-build
    ## Named so the relying party can run the same image instead of building
    ## a second one. The two frontends differ only in their environment now
    ## -- see RAZZLE_IDENTITY_SHOW_PLONE_LOGIN below.
    image: *frontend-image
    environment:
      RAZZLE_INTERNAL_API_PATH: http://idp-backend:8080/Plone
      ## This site's users *are* local: it is where people sign in in order
      ## to sign in elsewhere, and the consent screen is reached by having a
      ## session here. Without the password form it has no way in except the
      ## magic link.
      ##
      ## Runtime, not a build argument. It is read through Volto's
      ## `runtimeConfig`, which resolves `process.env` on the server and
      ## `window.env` on the client, so one image answers either way.
      RAZZLE_IDENTITY_SHOW_PLONE_LOGIN: 'true'
    depends_on:
      - idp-backend
    labels:
      - traefik.enable=true
      - traefik.constraint-label=public
      - traefik.http.services.svc-idp-frontend.loadbalancer.server.port=3000
      - traefik.http.routers.rt-idp-frontend.rule=Host(`id.${DEMO_STACK_DOMAIN:-localhost}`)
      - traefik.http.routers.rt-idp-frontend.entrypoints=http
      - traefik.http.routers.rt-idp-frontend.service=svc-idp-frontend
      - traefik.http.routers.rt-idp-frontend.middlewares=gzip

  idp-backend:
    build: *backend-build
    environment:
      <<: *demo-env
      DEMO_PROFILE: identitydemo:idp
      ## This site's ZODB lives in the `idp` database. RelStorage and psycopg2
      ## are already in the Plone base image, and the entrypoint switches to
      ## relstorage.conf on seeing this variable, so there is nothing to
      ## install and nothing to configure beyond the DSN. The schema is
      ## created on first start: RELSTORAGE_CREATE_SCHEMA defaults to true.
      RELSTORAGE_DSN: >-
        dbname='idp' user='identity' host='db' password='identity-demo-password'
      ## And its authentication records go to the `audit` database. Only this
      ## site: the relying party keeps the built-in log, so the stack shows
      ## both arrangements side by side.
      ##
      ## Read from the environment rather than the registry because a DSN
      ## carries a password, and the registry is exported by GenericSetup and
      ## readable through the control panel.
      IDENTITY_AUDIT_DSN: >-
        postgresql+psycopg2://identity:identity-demo-password@db:5432/audit
    depends_on:
      # Waited for rather than merely started: this site's ZODB is in there.
      # It was worth waiting for even when only the audit rows were, since
      # nothing retries that database and an early login would have been
      # logged and dropped; now the site cannot open its database at all.
      db:
        condition: service_healthy
    volumes:
      - ./backend/demo/src/identitydemo/setuphandlers/idpcontent:/example-content
    labels:
      - traefik.enable=true
      - traefik.constraint-label=public
      - traefik.http.services.svc-idp-backend.loadbalancer.server.port=8080

      ## VHM rewrite /++api++/
      - "traefik.http.middlewares.mw-idp-vhm-api.replacepathregex.regex=^/\\+\\+api\\+\\+($$|/.*)"
      - "traefik.http.middlewares.mw-idp-vhm-api.replacepathregex.replacement=/VirtualHostBase/http/id.${DEMO_STACK_DOMAIN:-localhost}/Plone/++api++/VirtualHostRoot$$1"

      ## VHM rewrite /ClassicUI/
      - "traefik.http.middlewares.mw-idp-vhm-classic.replacepathregex.regex=^/ClassicUI($$|/.*)"
      - "traefik.http.middlewares.mw-idp-vhm-classic.replacepathregex.replacement=/VirtualHostBase/http/id.${DEMO_STACK_DOMAIN:-localhost}/Plone/VirtualHostRoot/_vh_ClassicUI$$1"

      ## VHM rewrite for the OAuth endpoints, which are Zope views on the site
      ## root and not REST API services. Without this router they are simply
      ## not routed to the backend at all, and the issuer URL published in the
      ## discovery document points at the Volto frontend. This is what makes
      ## the decision to configure the issuer rather than derive it from the
      ## portal URL load-bearing rather than fussy.
      - "traefik.http.middlewares.mw-idp-vhm-oauth.replacepathregex.regex=^/(.*)"
      - "traefik.http.middlewares.mw-idp-vhm-oauth.replacepathregex.replacement=/VirtualHostBase/http/id.${DEMO_STACK_DOMAIN:-localhost}/Plone/VirtualHostRoot/$$1"

      ## Basic Authentication for ClassicUI. Defaults to admin:admin.
      - traefik.http.middlewares.mw-idp-auth.basicauth.headerField=X-Auth-ClassicUI
      - traefik.http.middlewares.mw-idp-auth.basicauth.users=admin:$$apr1$$uZPT5Fgu$$AmlIdamxT5ipBvPlsdfD70

      # Routers
      - traefik.http.routers.rt-idp-api.rule=Host(`id.${DEMO_STACK_DOMAIN:-localhost}`) && PathPrefix(`/++api++`)
      - traefik.http.routers.rt-idp-api.entrypoints=http
      - traefik.http.routers.rt-idp-api.service=svc-idp-backend
      - traefik.http.routers.rt-idp-api.middlewares=gzip,mw-idp-vhm-api

      - traefik.http.routers.rt-idp-classic.rule=Host(`id.${DEMO_STACK_DOMAIN:-localhost}`) && PathPrefix(`/ClassicUI`)
      - traefik.http.routers.rt-idp-classic.entrypoints=http
      - traefik.http.routers.rt-idp-classic.service=svc-idp-backend
      - traefik.http.routers.rt-idp-classic.middlewares=gzip,mw-idp-auth,mw-idp-vhm-classic

      ## The OAuth surface. Every path here is a browser-facing endpoint of the
      ## authorization server: discovery, the authorize view (which also serves
      ## and receives the consent screen), the token endpoint, the public keys
      ## and userinfo.
      - traefik.http.routers.rt-idp-oauth.rule=Host(`id.${DEMO_STACK_DOMAIN:-localhost}`) && (PathPrefix(`/.well-known`) || PathPrefix(`/@@oauth-authorize`) || PathPrefix(`/@@oauth-token`) || PathPrefix(`/@@oauth-jwks`) || PathPrefix(`/@@oauth-userinfo`) || PathPrefix(`/@@backchannel-logout`))
      - traefik.http.routers.rt-idp-oauth.entrypoints=http
      - traefik.http.routers.rt-idp-oauth.service=svc-idp-backend
      - traefik.http.routers.rt-idp-oauth.middlewares=gzip,mw-idp-vhm-oauth

      ## The cookie-auth plugin's challenge path, which is where an anonymous
      ## visitor to the authorize view is sent before landing on /login.
      ## /login itself is *not* here: it is Volto's, which is the point. The
      ## visitor signs in there with a password, and the server layer's
      ## session plugin reads the resulting Volto token when the browser
      ## comes back to the authorization endpoint.
      - traefik.http.routers.rt-idp-login.rule=Host(`id.${DEMO_STACK_DOMAIN:-localhost}`) && (PathPrefix(`/acl_users/credentials_cookie_auth`) || PathPrefix(`/++resource++`) || PathPrefix(`/++plone++`))
      - traefik.http.routers.rt-idp-login.entrypoints=http
      - traefik.http.routers.rt-idp-login.service=svc-idp-backend
      - traefik.http.routers.rt-idp-login.middlewares=gzip,mw-idp-vhm-oauth
      ## Higher than the frontend's catch-all Host() rule.
      - traefik.http.routers.rt-idp-login.priority=100

  # ------------------------------------------------------------------
  # plone.localhost -- the relying party
  # ------------------------------------------------------------------
  rp-frontend:
    ## No `build:` -- the image is the one idp-frontend builds. `depends_on`
    ## names it so Compose has built it before this service starts; without
    ## that, `docker compose up` on a clean machine races an image that does
    ## not exist yet.
    image: *frontend-image
    environment:
      RAZZLE_INTERNAL_API_PATH: http://rp-backend:8080/Plone
      ## The relying party has exactly one way in, and it is the identity
      ## provider. Offering a local password beside it would be offering a
      ## second way into the same account, which is the whole thing this
      ## federation exists to avoid. Stated rather than left to the default,
      ## because this is the site the point is about.
      RAZZLE_IDENTITY_SHOW_PLONE_LOGIN: 'false'
    depends_on:
      - rp-backend
      - idp-frontend
    labels:
      - traefik.enable=true
      - traefik.constraint-label=public
      - traefik.http.services.svc-rp-frontend.loadbalancer.server.port=3000
      - traefik.http.routers.rt-rp-frontend.rule=Host(`plone.${DEMO_STACK_DOMAIN:-localhost}`)
      - traefik.http.routers.rt-rp-frontend.entrypoints=http
      - traefik.http.routers.rt-rp-frontend.service=svc-rp-frontend
      - traefik.http.routers.rt-rp-frontend.middlewares=gzip

  rp-backend:
    build: *backend-build
    environment:
      <<: *demo-env
      DEMO_PROFILE: identitydemo:rp
      ## Its own database in the same server, so the two sites share a
      ## PostgreSQL and not a ZODB.
      RELSTORAGE_DSN: >-
        dbname='rp' user='identity' host='db' password='identity-demo-password'
      ## No IDENTITY_AUDIT_DSN here, deliberately. This site records to the
      ## bounded log inside its own plugin, which is what a site that installs
      ## the add-on and changes nothing does.
    depends_on:
      # Waited for rather than merely started: this site's ZODB is in there.
      # It was worth waiting for even when only the audit rows were, since
      # nothing retries that database and an early login would have been
      # logged and dropped; now the site cannot open its database at all.
      db:
        condition: service_healthy
    volumes:
      - ./backend/demo/src/identitydemo/setuphandlers/rpcontent:/example-content
    labels:
      - traefik.enable=true
      - traefik.constraint-label=public
      - traefik.http.services.svc-rp-backend.loadbalancer.server.port=8080

      - "traefik.http.middlewares.mw-rp-vhm-api.replacepathregex.regex=^/\\+\\+api\\+\\+($$|/.*)"
      - "traefik.http.middlewares.mw-rp-vhm-api.replacepathregex.replacement=/VirtualHostBase/http/plone.${DEMO_STACK_DOMAIN:-localhost}/Plone/++api++/VirtualHostRoot$$1"

      - "traefik.http.middlewares.mw-rp-vhm-classic.replacepathregex.regex=^/ClassicUI($$|/.*)"
      - "traefik.http.middlewares.mw-rp-vhm-classic.replacepathregex.replacement=/VirtualHostBase/http/plone.${DEMO_STACK_DOMAIN:-localhost}/Plone/VirtualHostRoot/_vh_ClassicUI$$1"

      - traefik.http.middlewares.mw-rp-auth.basicauth.headerField=X-Auth-ClassicUI
      - traefik.http.middlewares.mw-rp-auth.basicauth.users=admin:$$apr1$$uZPT5Fgu$$AmlIdamxT5ipBvPlsdfD70

      - traefik.http.routers.rt-rp-api.rule=Host(`plone.${DEMO_STACK_DOMAIN:-localhost}`) && PathPrefix(`/++api++`)
      - traefik.http.routers.rt-rp-api.entrypoints=http
      - traefik.http.routers.rt-rp-api.service=svc-rp-backend
      - traefik.http.routers.rt-rp-api.middlewares=gzip,mw-rp-vhm-api

      - traefik.http.routers.rt-rp-classic.rule=Host(`plone.${DEMO_STACK_DOMAIN:-localhost}`) && PathPrefix(`/ClassicUI`)
      - traefik.http.routers.rt-rp-classic.entrypoints=http
      - traefik.http.routers.rt-rp-classic.service=svc-rp-backend
      - traefik.http.routers.rt-rp-classic.middlewares=gzip,mw-rp-auth,mw-rp-vhm-classic

  # ------------------------------------------------------------------
  # One PostgreSQL, three databases
  # ------------------------------------------------------------------
  #
  #   idp     the ZODB of id.localhost, through RelStorage
  #   rp      the ZODB of plone.localhost, through RelStorage
  #   audit   the identity provider's authentication records
  #
  # The two ZEO servers this replaces were the ordinary way to run a Plone
  # container, and RelStorage is the other one. It is worth showing here
  # because the base image already carries it: no package changes, and the
  # entrypoint switches config on seeing RELSTORAGE_DSN.
  #
  # Only the provider records its authentication events to `audit`. The
  # relying party keeps the bounded log inside its own plugin, so the stack
  # shows both arrangements at once: one site whose log is a table you can
  # query, and one behaving exactly as an unconfigured install does.
  #
  # `idp` and `rp` are created by an init script, because the official image
  # makes only the one database POSTGRES_DB names. It runs once, on an empty
  # data directory. To read the audit table:
  #
  #   docker compose -f docker-compose.demo.yml exec db \
  #       psql -U identity -d audit \
  #       -c 'select site, userid, event, success, timestamp
  #           from identity_audit order by timestamp desc limit 20;'
  #
  # Not exposed through Traefik and no host port published: nothing outside
  # the stack should reach it, and the backends reach it by service name.
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity-demo-password
      POSTGRES_DB: audit
    volumes:
      # `/var/lib/postgresql`, not `/var/lib/postgresql/data`. From 18 the
      # image stores data in a major-version-specific subdirectory so that
      # `pg_upgrade --link` can work across a single mount, and it refuses to
      # start when it finds a volume mounted at the old path. The container
      # exits 1 with an explanation, which `docker compose config` cannot see.
      - vol-db-data:/var/lib/postgresql
      # Read once, on first start, in filename order.
      - ./backend/demo/postgres/create-databases.sh:/docker-entrypoint-initdb.d/10-create-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d audit"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  # One volume now: both ZODBs and the audit table live in the same
  # PostgreSQL. `down --volumes` resets the whole stack, which is also what
  # re-runs the database creation script.
  vol-db-data: {}
