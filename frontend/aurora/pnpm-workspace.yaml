packages:
  - 'core/apps/aurora'
  - 'core/packages/*'
  - '!core/packages/volto*'
  - '!core/packages/coresandbox'
  # The add-on and the package it shares with the Volto add-on live beside
  # this harness, not inside it: ../packages is where both frontends find
  # them.
  - '../packages/aurora-identity'
  - '../packages/identity-core'
  # A dev-only add-on adapting Vite to that layout; see harness/vite.extend.js.
  - 'harness'

publicHoistPattern:
  - '*eslint*'
  - '*prettier*'
  - '*stylelint*'
  - '*playwright*'

overrides:
  react: ^19.2.0
  react-dom: ^19.2.0
  jotai: ^2.12.5
  # React Aria, the same everywhere in both harnesses, at the ranges of
  # core/catalog.json. The Volto harness (../package.json) overrides them to
  # the same ranges, so identity-core's components run on one version of
  # React Aria in both frontends. Until Volto's @plone/components and
  # Aurora's agree on one by themselves (#132, phase 5).
  react-aria-components: '^1.17.0'
  react-aria: '^3.48.0'
  react-stately: '^3.46.0'
  '@react-aria/utils': '^3.34.0'
  '@react-spectrum/utils': '^3.13.0'
  '@internationalized/date': '^3.12.1'

allowBuilds:
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  lightningcss-cli: true
  msgpackr-extract: true
  unrs-resolver: true

# The default pnpm catalog is loaded from `core/catalog.json` using `.pnpmfile.cjs`.
# If you want to customize the versions of the catalog, do it in there.
# You can also add your own custom pnpm catalog using the pnpm named catalogs
# by defining them here. See https://pnpm.io/catalogs#named-catalogs
